services:
  postgres:
    image: postgres:18-alpine
    container_name: trailbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-trailbook}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-trailbook}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-trailbook}
    ports:
      - "55432:5432"
    volumes:
      - trailbook-postgres-18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_POSTGRES_USER:-trailbook} -d ${LOCAL_POSTGRES_DB:-trailbook}"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres_test:
    image: postgres:16-alpine
    container_name: trailbook-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-trailbook_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-trailbook_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-trailbook_test}
    ports:
      - "55433:5432"
    volumes:
      - trailbook-postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-trailbook_test} -d ${POSTGRES_TEST_DB:-trailbook_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: trailbook-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: trailbook-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trailbook}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-trailbook-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - trailbook-minio-data:/data
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: trailbook-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trailbook}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-trailbook-secret}
      S3_BUCKET: ${S3_BUCKET:-trailbook-media}
    entrypoint: >
      /bin/sh -c "
      until mc alias set trailbook http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        sleep 1;
      done &&
      mc mb --ignore-existing trailbook/$$S3_BUCKET &&
      mc anonymous set none trailbook/$$S3_BUCKET
      "

volumes:
  trailbook-postgres-18-data:
  trailbook-postgres-test-data:
  trailbook-minio-data:
