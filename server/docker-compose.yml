services:
  postgres:
    image: postgres:16-alpine
    container_name: trailbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trailbook}
      POSTGRES_USER: ${POSTGRES_USER:-trailbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trailbook}
    ports:
      - "55432:5432"
    volumes:
      - trailbook-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trailbook} -d ${POSTGRES_DB:-trailbook}"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres_test:
    image: postgres:16-alpine
    container_name: trailbook-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-trailbook_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-trailbook_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-trailbook_test}
    ports:
      - "55433:5432"
    volumes:
      - trailbook-postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-trailbook_test} -d ${POSTGRES_TEST_DB:-trailbook_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: trailbook-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  trailbook-postgres-data:
  trailbook-postgres-test-data:
